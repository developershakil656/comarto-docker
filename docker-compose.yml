services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-comarto.com}
      - NGINX_ENVSUBST_FILTER=APP_
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_storage_volume:/shared-storage:ro
    depends_on:
      - backend
      - admin-backend
      - wordpress-akhlaqfood
      - wordpress-gadget

  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./env/backend.env:/var/www/backend/.env
      - ./docker-config/php-limits.ini:/usr/local/etc/php/conf.d/php-limits.ini
      - shared_storage_volume:/var/www/backend/storage/app/public
    command: php-fpm

  admin-backend:
    build: ./admin-backend
    container_name: admin-backend
    volumes:
      - ./env/admin-backend.env:/var/www/admin-backend/.env
      - ./docker-config/php-limits.ini:/usr/local/etc/php/conf.d/php-limits.ini
      - shared_storage_volume:/var/www/admin-backend/storage/app/public
    command: php-fpm

  frontend:
    build: ./frontend
    container_name: frontend

  admin-frontend:
    build: ./admin-frontend
    container_name: admin-frontend

  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file: ./env/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      MAX_EXECUTION_TIME: 600
    depends_on:
      - mysql

  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    container_name: meilisearch
    volumes:
      - ./meilisearch/data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}

  # WordPress for Akhlaq Foods
  wordpress-akhlaqfood:
    image: wordpress:php8.3-fpm
    container_name: wordpress-akhlaqfood
    env_file: ./env/wordpress.env
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${WORDPRESS_AKHLAQFOOD_DB_USER:-b2buser}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_AKHLAQFOOD_DB_PASSWORD:-b2bpass}
      WORDPRESS_DB_NAME: ${WORDPRESS_AKHLAQFOOD_DB_NAME:-wordpress_akhlaqfood}
      WORDPRESS_TABLE_PREFIX: wp_akhlaqfood_
      WORDPRESS_SITE_URL: https://akhlaqfood.${APP_DOMAIN:-comarto.com}
      WORDPRESS_HOME: https://akhlaqfood.${APP_DOMAIN:-comarto.com}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

  # WordPress for Gadget
  wordpress-gadget:
    image: wordpress:php8.3-fpm
    container_name: wordpress-gadget
    env_file: ./env/wordpress.env
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${WORDPRESS_GADGET_DB_USER:-b2buser}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_GADGET_DB_PASSWORD:-b2bpass}
      WORDPRESS_DB_NAME: ${WORDPRESS_GADGET_DB_NAME:-wordpress_gadget}
      WORDPRESS_TABLE_PREFIX: wp_gadget_
      WORDPRESS_SITE_URL: https://gadget.${APP_DOMAIN:-comarto.com}
      WORDPRESS_HOME: https://gadget.${APP_DOMAIN:-comarto.com}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

volumes:
  mysql_data:
  frontend_build:
  admin_frontend_build:
  shared_storage_volume:  # New shared volume for file storage
  wordpress_akhlaqfood_data:
  wordpress_gadget_data: